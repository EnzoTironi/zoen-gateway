# Cloudflare Worker reverse-proxy for the executor HTTP/MCP API.
# No UI, D1, Durable Objects, or WASM kernel.
name = "executor-edge"
main = "workers/proxy.js"
compatibility_date = "2025-04-01"

# Set EXECUTOR_UPSTREAM to the daemon origin, e.g. http://127.0.0.1:4788
# wrangler secret / vars — never a browser surface.
[vars]
EXECUTOR_UPSTREAM = "http://127.0.0.1:4788"
